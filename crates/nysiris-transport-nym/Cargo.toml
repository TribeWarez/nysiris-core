[package]
name = "nysiris-transport-nym"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Nym transport adapter for Nysiris native clients. The real nym-sdk adapter is behind the nym feature and was verified on mainnet; default builds use an explicit unavailable stub."
readme = "README.md"
keywords = ["nym", "mixnet", "transport", "privacy"]
categories = ["network-programming", "cryptography"]

[features]
default = []
nym = [
    "dep:nym-sdk",
    "dep:tokio",
    "dep:nym-api-requests",
    "dep:nym-bandwidth-controller",
    "dep:nym-bandwidth-fetcher",
    "dep:nym-bin-common",
    "dep:nym-bls12_381-fork",
    "dep:nym-client-core",
    "dep:nym-client-core-config-types",
    "dep:nym-client-core-gateways-storage",
    "dep:nym-client-core-surb-storage",
    "dep:nym-coconut-dkg-common",
    "dep:nym-common",
    "dep:nym-compact-ecash",
    "dep:nym-config",
    "dep:nym-contracts-common",
    "dep:nym-credentials",
    "dep:nym-credentials-interface",
    "dep:nym-credential-storage",
    "dep:nym-crypto",
    "dep:nym-directory-attestation",
    "dep:nym-directory-contract-common",
    "dep:nym-ecash-contract-common",
    "dep:nym-ecash-signer-check-types",
    "dep:nym-ecash-time",
    "dep:nym-exit-policy",
    "dep:nym-gateway-client",
    "dep:nym-gateway-requests",
    "dep:nym-geolocation-contract-common",
    "dep:nym-group-contract-common",
    "dep:nym-http-api-client",
    "dep:nym-http-api-client-macro",
    "dep:nym-http-api-common",
    "dep:nym-id",
    "dep:nym-ip-packet-requests",
    "dep:nym-kkt-ciphersuite",
    "dep:nym-lp-data",
    "dep:nym-lthash",
    "dep:nym-metrics",
    "dep:nym-mixnet-client",
    "dep:nym-mixnet-contract-common",
    "dep:nym-multisig-contract-common",
    "dep:nym-network-defaults",
    "dep:nym-network-monitors-contract-common",
    "dep:nym-node-families-contract-common",
    "dep:nym-node-requests",
    "dep:nym-noise",
    "dep:nym-noise-keys",
    "dep:nym-nonexhaustive-delayqueue",
    "dep:nym-ordered-buffer",
    "dep:nym-pemstore",
    "dep:nym-performance-contract-common",
    "dep:nym-serde-helpers",
    "dep:nym-service-provider-requests-common",
    "dep:nym-service-providers-common",
    "dep:nym-socks5-client-core",
    "dep:nym-socks5-proxy-helpers",
    "dep:nym-socks5-requests",
    "dep:nym-sphinx",
    "dep:nym-sphinx-acknowledgements",
    "dep:nym-sphinx-addressing",
    "dep:nym-sphinx-anonymous-replies",
    "dep:nym-sphinx-chunking",
    "dep:nym-sphinx-cover",
    "dep:nym-sphinx-forwarding",
    "dep:nym-sphinx-framing",
    "dep:nym-sphinx-params",
    "dep:nym-sphinx-routing",
    "dep:nym-sphinx-types",
    "dep:nym-sqlx-pool-guard",
    "dep:nym-statistics-common",
    "dep:nym-task",
    "dep:nym-ticketbooks-merkle",
    "dep:nym-topology",
    "dep:nym-upgrade-mode-check",
    "dep:nym-validator-client",
    "dep:nym-vesting-contract-common",
    "dep:nym-wasm-utils",
    "dep:nym-wireguard-types"
