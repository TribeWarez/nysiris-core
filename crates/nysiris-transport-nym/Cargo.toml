[dependencies]
nysiris-core.workspace = true
thiserror.workspace = true
# nym-sdk is versioned independently of the other nym-* crates (the 1.22.0
# line covers the siblings). Pin the mainnet-verified release exactly so a
# fresh resolve cannot drift to a later 1.21.x/1.22.x; bump deliberately and
# re-run `cargo check --features nym`.
nym-sdk = { version = "=1.21.6", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"], optional = true }
# ---------------------------------------------------------------------------
# RESOLUTION-ONLY NYM PINS. No code in this crate uses them: they are listed
# in the `nym` feature purely so their exact version requirements join the
# resolve whenever a consumer enables that feature. They are already in
# nym-sdk's tree, so this adds no extra compilation.
#
# The Nym 1.22.x patch line on crates.io is internally inconsistent:
# nym-client-core 1.22.2 requires the yanked tokio_with_wasm 0.10.1, so a
# from-scratch resolve falls back to nym-client-core 1.22.1, which does not
# compile against the 1.22.2 nym-crypto / nym-client-core-config-types
# siblings. Without these pins, anyone building this crate from crates.io
# (no Cargo.lock of ours to lean on) gets that unbuildable graph.
#
# The exact pins below reproduce the mainnet-verified Cargo.lock set
# (Nym 1.22.0, plus nym-sdk and nym-ip-packet-requests 1.21.6 as required by
# nym-sdk 1.21.6). Cargo ignores optional deps that no enabled feature
# references, so they must stay in `nym` rather than a private pin feature.
# Bump them together with Cargo.lock and re-run scripts/check-nym-pins.sh.
# ---------------------------------------------------------------------------
nym-api-requests = { version = "=1.22.0", optional = true }
nym-bandwidth-controller = { version = "=1.22.0", optional = true }
nym-bandwidth-fetcher = { version = "=1.22.0", optional = true }
nym-bin-common = { version = "=1.22.0", optional = true }
nym-bls12_381-fork = { version = "=0.8.0-forked", optional = true }
nym-client-core = { version = "=1.22.0", optional = true }
nym-client-core-config-types = { version = "=1.22.0", optional = true }
nym-client-core-gateways-storage = { version = "=1.22.0", optional = true }
nym-client-core-surb-storage = { version = "=1.22.0", optional = true }
nym-coconut-dkg-common = { version = "=1.22.0", optional = true }
nym-common = { version = "=1.22.0", optional = true }
nym-compact-ecash = { version = "=1.22.0", optional = true }
nym-config = { version = "=1.22.0", optional = true }
nym-contracts-common = { version = "=1.22.0", optional = true }
nym-credentials = { version = "=1.22.0", optional = true }
nym-credentials-interface = { version = "=1.22.0", optional = true }
nym-credential-storage = { version = "=1.22.0", optional = true }
nym-crypto = { version = "=1.22.0", optional = true }
nym-directory-attestation = { version = "=1.22.0", optional = true }
nym-directory-contract-common = { version = "=1.22.0", optional = true }
nym-ecash-contract-common = { version = "=1.22.0", optional = true }
