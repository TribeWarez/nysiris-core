nym-ecash-time = { version = "=1.22.0", optional = true }
nym-exit-policy = { version = "=1.22.0", optional = true }
nym-gateway-client = { version = "=1.22.0", optional = true }
nym-gateway-requests = { version = "=1.22.0", optional = true }
nym-geolocation-contract-common = { version = "=1.22.0", optional = true }
nym-group-contract-common = { version = "=1.22.0", optional = true }
nym-http-api-client = { version = "=1.22.0", optional = true }
nym-http-api-client-macro = { version = "=1.22.0", optional = true }
nym-http-api-common = { version = "=1.22.0", optional = true }
nym-id = { version = "=1.22.0", optional = true }
