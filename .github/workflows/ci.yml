name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      # --locked everywhere: Cargo.lock pins the known-good Nym 1.22.0 set, and
      # a fresh resolve picks 1.22.1/1.22.2, which do not compile together.
      # Failing loudly on a stale lock is better than silently re-resolving.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  nym-transport:
    name: Nym transport compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check nym feature
        run: cargo check -p nysiris-transport-nym --features nym --locked

  nym-pins:
    name: Nym pins reproduce the locked set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Resolution only, no Nym build, so this stays cheap. It reproduces the
      # downstream-consumer path: a project with no lockfile that enables the
      # `nym` feature. The exact pins in nysiris-transport-nym must land on the
      # 1.22.0 set recorded in Cargo.lock, otherwise that resolve is unbuildable.
      - name: Check from-scratch Nym resolution
        run: bash scripts/check-nym-pins.sh

  semver:
    name: API compatibility (semver)
    runs-on: ubuntu-latest
    steps:
      # Full history is needed to resolve the pre-tag baseline commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find previous release tag
        id: baseline
        run: |
          # Compare against the newest v* tag reachable from the parent commit.
          # Before the first release there is no baseline to compare against.
          rev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -z "$rev" ]; then
            echo "::notice::no earlier v* tag reachable; skipping API compatibility check"
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      # The crates are not on crates.io yet, so the default registry baseline
      # would not resolve. Pin the git baseline explicitly; the action checks
      # every crate in the workspace manifest.
      #
      # `feature-group: default-features` is deliberate. cargo-semver-checks
      # builds each crate in a throwaway placeholder project and runs
      # `cargo update` there, so this repository's Cargo.lock is never
      # consulted. The `nym` feature cannot be resolved coherently from
      # crates.io: nym-client-core 1.22.2 requires the yanked tokio_with_wasm
      # 0.10.1, and the 1.22.1 fallback does not compile against the 1.22.2
      # nym-crypto/nym-client-core-config-types siblings. Checking all features
      # would therefore fail on an upstream packaging bug, not on our API. The
      # `nym` feature is compiled by the `nym-transport` job above, which builds
      # from the pinned lockfile.
      - name: cargo semver-checks against the previous tag
        if: steps.baseline.outputs.rev != ''
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          baseline-rev: ${{ steps.baseline.outputs.rev }}
          manifest-path: Cargo.toml
          feature-group: default-features

